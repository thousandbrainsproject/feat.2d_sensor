# @package _global_

defaults:
  - /monty: evidencegraph_exp0_e3_t500_tot2500
  - /monty/motor_system_config: distant_2
  - /monty/learning_module: evidence_2lm_burst
  - /monty/sensor_module: 2sm_camera_dist
  - /monty/connectivity: 2lm_2sm
  - /environment: habitat_dist_agent_sensors2
  - /env_interface: train_disk_horz
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: missing_depthto3d_sensor3
  - /logging: silent_info_train
  - /hydra: default

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 1
    n_eval_epochs: 3
    model_name_or_path: ""
    min_lms_match: 2
    seed: 42
    supervised_lm_ids:
      - learning_module_1
    logging:
      run_name: supervised_pre_training_objects_with_logos_lvl1_comp_models_burst_sampling
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_ycb_v12}
      python_log_level: INFO
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects}
    train_env_interface_args:
      object_names:
        - 007_disk_tbp_horz
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        positions:
          - [0.0, 1.5, 0.0]
          - [-0.03, 1.5, 0.0]
          - [0.03, 1.5, 0.0]
        rotations: [[0, 0, 0]]
    monty_config:
      learning_modules:
        learning_module_0:
          _target_: tbp.monty.frameworks.models.detailed_logging_lm.EvidenceGraphLMWithDetailedLogging
        learning_module_1:
          _target_: tbp.monty.frameworks.models.detailed_logging_lm.EvidenceGraphLMWithDetailedLogging
      monty_args:
        num_exploratory_steps: 0
        min_train_steps: 500
      motor_system_config:
        motor_system_args:
          policy:
            action_sampler:
              rotation_degrees: 2.0
      sensor_modules:
        sensor_module_0:
          save_raw_obs: true
        sensor_module_1:
          save_raw_obs: true
