# @package _global_

defaults:
  - /monty: graph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: displacement_1lm
  - /monty/sensor_module: twodsm_dist
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_dist_agent
  - /env_interface: train_diskcylinder_horz
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: silent_info_train
  - /hydra: default

constants:
  zoom: 30
  blur_sigma: 5

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ""
    n_eval_epochs: 3
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: diskcylinder_learning_2d_30x_5sigma
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/2d_sensor}
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects}
        agents:
          agent_args:
            resolutions:
              - [64, 64]
              - [64, 64]
            zooms:
              - ${constants.zoom}
              - 1.0
      transform:
        - _target_: tbp.monty.frameworks.environment_utils.transforms.GaussianBlurRGB
          agent_id: ${monty.agent_id:agent_id_0}
          sigma: ${constants.blur_sigma}
          sensor_ids: [patch]
        - _target_: tbp.monty.frameworks.environment_utils.transforms.MissingToMaxDepth
          agent_id: ${monty.agent_id:agent_id_0}
          max_depth: 1
        - _target_: tbp.monty.frameworks.environment_utils.transforms.DepthTo3DLocations
          agent_id: ${monty.agent_id:agent_id_0}
          sensor_ids: [patch, view_finder]
          resolutions:
            - [64, 64]
            - [64, 64]
          world_coord: true
          zooms:
            - ${constants.zoom}
            - 1.0
          get_all_points: true
          use_semantic_sensor: false
    train_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        positions:
          - [0.0, 1.5, 0.0]
          - [-0.03, 1.5, 0.0]
          - [0.03, 1.5, 0.0]
        rotations: [[0, 0, 0]]
