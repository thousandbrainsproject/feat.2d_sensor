# @package _global_

defaults:
  - /monty: graph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: displacement_1lm
  - /monty/sensor_module: camera_dist
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_dist_agent
  - /env_interface: train_disk_horz
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: silent_info_train
  - /hydra: default

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ""
    n_eval_epochs: 3
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: disk_v0_3d
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/2d_sensor}
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects}
    train_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        positions:
          - [0.0, 1.5, 0.0]
          - [-0.03, 1.5, 0.0]
          - [0.03, 1.5, 0.0]
        rotations: [[0, 0, 0]]
