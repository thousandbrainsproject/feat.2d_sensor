# @package config.monty_config

defaults:
  - motor_system: informed_goal_state_driven
  - learning_module/two_stacked_constrained_lms_with_burst_sampling@learning_module_configs
  - sensor_module: sm0_twodsm_sm1_twodsm_sm2_probe
  - connectivity: 2lm_stacked

monty_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.model.MontyForEvidenceGraphMatching}
monty_args:
  num_exploratory_steps: 1000
  min_eval_steps: 3
  min_train_steps: 3
  max_total_steps: 2500
