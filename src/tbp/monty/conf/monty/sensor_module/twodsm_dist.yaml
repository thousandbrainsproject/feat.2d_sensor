# @package experiment.config.monty_config.sensor_module_configs

sensor_module_0:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.two_d_sensor_module.TwoDSensorModule}
  sensor_module_args:
    sensor_module_id: patch
    save_raw_obs: true
    edge_detection_config:
      _target_: tbp.monty.frameworks.utils.edge_detection.EdgeDetectionConfig
      gaussian_sigma: 1.0
      kernel_size: 7
      strength_threshold: 0.1
      coherence_threshold: 0.5
      radius: 14.0
      sigma_r: 7.0
      depth_edge_threshold: 0.01
      max_center_offset: null
    noise_params: null
    features:
      - pose_vectors
      - pose_fully_defined
      - principal_curvatures
      - on_object
      - object_coverage
      - rgba
      - hsv
      - edge_strength
      - coherence
      - mean_depth
      - min_depth
    delta_thresholds: null
sensor_module_1:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.Probe}
  sensor_module_args:
    sensor_module_id: view_finder
    save_raw_obs: false
