# @package config.monty_config.sensor_module_configs

sensor_module_0:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.two_d_sensor_module.TwoDSensorModule}
  sensor_module_args:
    sensor_module_id: patch
    save_raw_obs: false
    edge_detection_config: null
    noise_params: null
    features:
      - pose_vectors
      - pose_fully_defined
      - principal_curvatures
      - on_object
      - object_coverage
      - rgba
      - hsv
      - edge_strength
      - coherence
      - mean_depth
      - min_depth
    delta_thresholds:
      on_object: 0
      n_steps: 20
      hsv: [0.1, 0.1, 0.1]
      pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
      distance: 0.01

sensor_module_1:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.Probe}
  sensor_module_args:
    sensor_module_id: view_finder
    save_raw_obs: false
