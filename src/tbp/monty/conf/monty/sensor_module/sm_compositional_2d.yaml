# @package config.monty_config.sensor_module_configs

sensor_module_0:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.two_d_sensor_module.SurfaceSM}
  sensor_module_args:
    sensor_module_id: patch_0
    save_raw_obs: false
    edge_detection_config: null
    noise_params: null
    features:
      - pose_vectors
      - pose_fully_defined
      - principal_curvatures
      - on_object
      - object_coverage
      - rgba
      - hsv
      - edge_strength
      - coherence
      - mean_depth
      - min_depth
    delta_thresholds:
      on_object: 0
      n_steps: 20
      hsv: [0.1, 0.1, 0.1]
      pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
      distance: 0.01

sensor_module_1:
  # SM1 is CameraSM even in 2D variant (morphology only, no color)
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.CameraSM}
  sensor_module_args:
    sensor_module_id: patch_1
    save_raw_obs: false
    noise_params: null
    features:
      - pose_vectors
      - pose_fully_defined
      - on_object
      - object_coverage
      - principal_curvatures
      - principal_curvatures_log
      - gaussian_curvature
      - mean_curvature
      - gaussian_curvature_sc
      - mean_curvature_sc
    delta_thresholds:
      on_object: 0
      n_steps: 20
      pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
      principal_curvatures_log: [2, 2]
      distance: 0.01

sensor_module_2:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.CameraSM}
  sensor_module_args:
    sensor_module_id: patch_2
    save_raw_obs: false
    noise_params: null
    features:
      - pose_vectors
      - pose_fully_defined
      - on_object
      - object_coverage
      - rgba
      - hsv
      - principal_curvatures
      - principal_curvatures_log
      - gaussian_curvature
      - mean_curvature
      - gaussian_curvature_sc
      - mean_curvature_sc
    delta_thresholds:
      on_object: 0
      n_steps: 100
      hsv: [0.2, 0.2, 0.2]
      pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
      principal_curvatures_log: [4, 4]
      distance: 0.05

sensor_module_3:
  sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.Probe}
  sensor_module_args:
    sensor_module_id: view_finder
    save_raw_obs: false
