# DisplacementGraphLM with basic settings.
# k=5 nearest neighbors, displacement-based matching.

learning_module_class: ${monty.class:tbp.monty.frameworks.models.displacement_matching.DisplacementGraphLM}
learning_module_args:
  k: 5
  match_attribute: displacement
  tolerance: 0.001
  use_relative_len: false
  graph_delta_thresholds: null
